events {
    worker_connections 1024;
}

http {
    upstream auth_api_cluster {
        least_conn; # Route to instance with fewest active connections
        server api1:4000 max_fails=3 fail_timeout=10s;
        server api2:4000 max_fails=3 fail_timeout=10s;
        server api3:4000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        # Frontend Client Proxy
        location / {
            proxy_pass http://web:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API & Health Load Balanced Proxy
        location ~ ^/(api|health|ready|metrics)/ {
            proxy_pass http://auth_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Fast timeouts for resilient failure detection
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }
    }
}
