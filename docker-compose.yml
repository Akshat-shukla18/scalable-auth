services:
  postgres:
    image: postgres:16-alpine
    container_name: scalable_auth_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_secret_password
      POSTGRES_DB: scalable_auth_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d scalable_auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scalable_auth_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api1:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: scalable_auth_api_1
    restart: unless-stopped
    environment:
      PORT: 4000
      INSTANCE_ID: api-node-1
      DATABASE_URL: postgresql://auth_user:auth_secret_password@postgres:5432/scalable_auth_db?schema=public
      REDIS_URL: redis://redis:6379
      RUN_INLINE_WORKER: "false"
      JWT_SECRET: super-secret-jwt-signing-key-production-32-chars!
      REFRESH_TOKEN_SECRET: super-secret-refresh-token-signing-key-32-chars!
      EMAIL_PROVIDER: mock
      FRONTEND_URL: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api2:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: scalable_auth_api_2
    restart: unless-stopped
    environment:
      PORT: 4000
      INSTANCE_ID: api-node-2
      DATABASE_URL: postgresql://auth_user:auth_secret_password@postgres:5432/scalable_auth_db?schema=public
      REDIS_URL: redis://redis:6379
      RUN_INLINE_WORKER: "false"
      JWT_SECRET: super-secret-jwt-signing-key-production-32-chars!
      REFRESH_TOKEN_SECRET: super-secret-refresh-token-signing-key-32-chars!
      EMAIL_PROVIDER: mock
      FRONTEND_URL: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api3:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: scalable_auth_api_3
    restart: unless-stopped
    environment:
      PORT: 4000
      INSTANCE_ID: api-node-3
      DATABASE_URL: postgresql://auth_user:auth_secret_password@postgres:5432/scalable_auth_db?schema=public
      REDIS_URL: redis://redis:6379
      RUN_INLINE_WORKER: "false"
      JWT_SECRET: super-secret-jwt-signing-key-production-32-chars!
      REFRESH_TOKEN_SECRET: super-secret-refresh-token-signing-key-32-chars!
      EMAIL_PROVIDER: mock
      FRONTEND_URL: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: scalable_auth_email_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://auth_user:auth_secret_password@postgres:5432/scalable_auth_db?schema=public
      REDIS_URL: redis://redis:6379
      EMAIL_PROVIDER: mock
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: scalable_auth_web
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: scalable_auth_load_balancer
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
      - web

volumes:
  pgdata:
  redisdata:
